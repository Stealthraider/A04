<!DOCTYPE html> <!-- This tag is telling the browser that we are using HTML 5. -->
<html lang="en"> <!-- This tag tells the document that we are using English -->

<head> <!-- This tag is the beginning head tag that holds everything inside the webpage -->
    <meta charset="UTF-8"> <!-- This tag allows the browser to display letters, numbers, and symbols correctly. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- This tag allows the webpage display properly on different screen sizes. -->
    <title>My First Web Page</title> <!-- This tag displays the title of the webpage -->

    <style> /* This tag is the start of the css styling section */
        body { /* This begins body styling and statements */
            font-family: Arial, sans-serif; /* This statement allows us to set the font */
            background-color: #f0f4f8; /* This statement allows us to change the background color*/
            color: #222222; /* This statement allows us to change the text color*/
            margin: 0; /* This statement sets the space outside the border for the body */
            text-align: center; /* This statement centers the text on the webpage. */
        } /* This ends body styling and statements */

        header { /* This begins header styling and statements */
            background-color: #183153; /* This statements changes the background color */
            color: white; /* This statement turns the header text white */
            padding: 25px; /* This statement sets the space inside the border for the header */
        } /* This ends header styling and statements */

        main { /* This begins main styling and statements */
            background-color: white; /* This statements sets the background color to white */
            max-width: 600px; /* This statement sets the width of the elements relating to main */
            margin: 40px auto; /* This statement sets the space outside the border */
            padding: 30px; /* This statement sets the space inside the border */
            border-radius: 10px; /* This statements rounds the corners of the main content area. */
        } /* This ends nmain styling and statements */

        h1 { /* This begins the h1 styling and statements */
            margin-bottom: 10px; /* This statements sets space below an element regarding h1  */
        } /* This ends h1 styling and statements */

        h2 { /* This begins h2 styling and statements */
            color: #183153; /* This statement changes text color in h2 */
        } /* This ends h2 styling and statements */

        p { /* This begins paragrapgh styling and statements */
            font-size: 18px; /* This statement sets the font size */
            line-height: 1.6; /* This statement sets the line height */
        } /* This ends paragraph styling and statements */

        footer { /* This begins footer styling and statements */
            background-color: #183153; /* This statement changes background color for footer */
            color: white; /* This statementy makes footer text white */
            padding: 18px; /* This statement sets space inside border */
            font-size: 14px; /* This statement sets font size */
        } /* This ends the footer styling and statement */
    </style> <!-- This is the ending tag for the css style -->
</head> <!--This is the ending tag for the the head tag -->

<body> <!-- This is the beginning tag for the body tag -->

    <header> <!-- This is the beginning tag of the header tag -->
        <h1>My First Web Page</h1> <!-- This is the first of header tags -->
        <p>Welcome to my first website!</p> <!-- This is the paragapagh tag that shows us the main text -->
    </header> <!-- The ending tag of the header tag -->

    <main> <!-- This is the beginning main tagthat will display text -->
        <h2>Student Information</h2> <!-- This is the second heading tag -->

        <p><strong>Username:</strong> Stealthraider</p> <!-- This statement shows my github username -->
        <p><strong>Course Name:</strong> Intro to Website Design</p> <!-- This statement shows the course description -->
        <p><strong>Course Number:</strong> 117</p> <!-- This statement shows the course number -->
        <p><strong>Course Section:</strong> 003</p> <!-- This statement shows the course section -->
        <p><strong>Due Date:</strong> October 13, 2026</p> <!-- This statement shows the due date -->
    </main> <!-- This is the ending main tag -->

    <footer> <!-- This is the beginning footer tag -->
        <p>&copy; 2026 Stealthraider | Created with ChatGPT | Due Date: 10/13/2026</p> <!-- This paragrapgh tag will display the copyright symbol, username, creator credit, and due date. -->
    </footer> <!-- This is the ending footer tag -->

</body> <!-- This is the ending body text that ends the webpage statements -->
</html> <!-- This is the ending html tag -->
